controller_manager:
  ros__parameters:
    update_rate: 50
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]
    wheel_separation: 0.233
    wheel_radius: 0.03575

    odom_frame_id: odom
    base_frame_id: base_link
    open_loop: false
    position_feedback: true
    enable_odom_tf: false
    publish_rate: 30.0
    cmd_vel_timeout: 0.5

    linear.x.max_velocity: 0.40
    linear.x.min_velocity: -0.40
    linear.x.max_acceleration: 0.60
    linear.x.max_deceleration: -0.80
    angular.z.max_velocity: 1.10
    angular.z.min_velocity: -1.10
    angular.z.max_acceleration: 1.80
    angular.z.max_deceleration: -2.20
